<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>KOSPI Insight</title>
    <!--
      저장된 테마를 화면을 그리기 전에 적용해서, 다크 모드 사용자에게 흰 화면이 잠깐 보이지 않게 한다 (T-54).
      기본은 라이트이고, 저장소를 쓸 수 없으면 라이트로 시작한다.
    -->
    <script>
      try {
        if (localStorage.getItem('kospi-theme') === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
