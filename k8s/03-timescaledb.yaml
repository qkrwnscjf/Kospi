apiVersion: apps/v1
kind: Deployment
metadata:
  name: timescaledb
  namespace: kospi
spec:
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      containers:
      - name: timescaledb
        image: timescale/timescaledb:latest-pg14
        env:
        - name: POSTGRES_PASSWORD
          value: "password"
        - name: POSTGRES_DB
          value: "kospi"
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  namespace: kospi
spec:
  ports:
  - port: 5432
  selector:
    app: timescaledb
