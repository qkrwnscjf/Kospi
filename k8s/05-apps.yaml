apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kospi
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        # TODO: <YOUR_DOCKER_ID> 부분을 실제 Docker Hub 아이디로 변경하세요.
        image: pjc020309/kospi-backend:v1
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: KAFKA_BROKERS
          value: "kafka:9092"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "password"
        - name: DB_HOST
          value: "timescaledb"
        - name: DB_NAME
          value: "kospi"
        - name: DB_PORT
          value: "5432"
        ports:
        - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kospi
spec:
  type: LoadBalancer
  ports:
  - port: 3001
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kospi
spec:
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        # TODO: <YOUR_DOCKER_ID> 부분을 실제 Docker Hub 아이디로 변경하세요.
        image: <YOUR_DOCKER_ID>/kospi-backend:v1
        command: ["npm", "run", "start:worker"]
        env:
        - name: NODE_ENV
          value: "production"
        - name: KAFKA_BROKERS
          value: "kafka:9092"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: kospi
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        # TODO: <YOUR_DOCKER_ID> 부분을 실제 Docker Hub 아이디로 변경하세요.
        image: <YOUR_DOCKER_ID>/kospi-frontend:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: kospi
spec:
  type: LoadBalancer
  ports:
  - port: 80
  selector:
    app: frontend
