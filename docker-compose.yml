version: '3.8'

services:
  # Zookeeper (Required for Kafka cluster coordination)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: kospi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    # 호스트 포트는 모두 이 PC(127.0.0.1)에만 연다. 같은 Wi-Fi·LAN의 다른 기기는 접속할 수 없다 (docs/Task_ORDER.md T-92, SEC-001)
    ports:
      - "127.0.0.1:2181:2181"

  # Apache Kafka (Message Queue)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kospi-kafka
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1 
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # 토픽은 코드(ensureTopics)가 명시적으로 만든다. 자동 생성을 끄면 파티션 1개짜리 토픽이 실수로 생기지 않는다 (T-11, D-17)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    # 브로커가 요청에 응답하면 healthy (docs/Task_ORDER.md T-29). 컨테이너 안에서 자기 자신만 확인한다.
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Redis (Caching Layer)
  redis:
    image: redis:alpine
    container_name: kospi-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # TimescaleDB (Time-series Database based on PostgreSQL)
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: kospi-timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kospi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    # 접속 가능 여부만 확인한다 (비밀번호를 쓰지 않음)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kospi"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kospi-backend
    restart: on-failure
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=kospi
      - KAFKA_BROKERS=kafka:29092
    # /api/health는 DB 스키마 생성(initDB) 후에 응답하므로, worker는 이 healthcheck를 기다린다 (T-29)
    # localhost는 Alpine wget에서 IPv6(::1)로 해석되는데 서버는 IPv4(0.0.0.0)에서만 대기하므로 127.0.0.1을 쓴다.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  # Data Ingestion Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kospi-worker
    restart: on-failure
    command: ["node", "dist/infrastructure/ingestion/worker.js"]
    # worker는 Kafka에만 전송한다. DB 저장은 db-sink가 맡으므로 DB 접속 정보가 필요 없다 (T-12, D-18)
    environment:
      - KAFKA_BROKERS=kafka:29092
      - POLLING_INTERVAL_MS=5000
    depends_on:
      kafka:
        condition: service_healthy

  # DB 적재 컨슈머 (T-12, D-18): market-ticks를 읽어 TimescaleDB에 배치 INSERT
  db-sink:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kospi-db-sink
    restart: on-failure
    command: ["node", "dist/infrastructure/sink/db-sink.js"]
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=kospi
      - KAFKA_BROKERS=kafka:29092
    # backend가 healthy해야 DB 스키마(initDB)가 만들어진 상태다
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      backend:
        condition: service_healthy

  # 증시 자금 흐름 수집기 (docs/Task_ORDER.md 11단계 A): KIS 시장별 투자자 순매수 → Kafka investor-flows
  # 증권사 키를 가진 컨테이너는 이것 하나뿐이다 (D-43). 공개 포트 없음.
  flows-collector:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kospi-flows-collector
    restart: on-failure
    command: ["node", "dist/infrastructure/flows/flows-collector.js"]
    environment:
      - KAFKA_BROKERS=kafka:29092
      - FLOWS_POLLING_INTERVAL_MS=30000
      # 키는 프로젝트 루트의 .env(사용자가 직접 작성, git 제외)에서 변수 치환으로만 받는다 (D-43, D-51).
      # 값이 없으면 KIS에 접속하지 않고 대기한다. KIS_ENV는 vps(모의투자, 기본) 또는 prod.
      - KIS_APP_KEY=${KIS_APP_KEY:-}
      - KIS_APP_SECRET=${KIS_APP_SECRET:-}
      - KIS_ENV=${KIS_ENV:-vps}
    depends_on:
      kafka:
        condition: service_healthy

  # KRX 일별 지수 수집기 (docs/Task_ORDER.md T-67): VKOSPI·KRX 섹터 5종 일별 종가 → Kafka index-daily
  # KRX 키를 가진 컨테이너는 이것 하나뿐이다. 공개 포트 없음. 접속 대상은 코드에 고정된 data-dbg.krx.co.kr 하나(2026-10-20 승인).
  krx-collector:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kospi-krx-collector
    restart: on-failure
    command: ["node", "dist/infrastructure/krx/krx-collector.js"]
    environment:
      - KAFKA_BROKERS=kafka:29092
      # 키는 프로젝트 루트의 .env(사용자가 직접 작성, git 제외)에서 변수 치환으로만 받는다 (D-51). 값이 없으면 접속하지 않고 대기한다.
      - KRX_API_KEY=${KRX_API_KEY:-}
      # 이미 저장된 기간을 묻는 내부 주소 (SEC-014). Docker 내부 네트워크만 쓰고 키는 보내지 않는다.
      - BACKEND_URL=http://backend:3001
    # Gateway(backend)가 먼저 떠 있어야 과거 채우기 직후의 최신값이 화면 캐시에 들어간다
    depends_on:
      kafka:
        condition: service_healthy
      backend:
        condition: service_healthy

  # DART 공시 수집기 (docs/Task_ORDER.md 12단계 T-74): 유가증권 공시 목록·자본 이벤트 금액 → Kafka disclosures
  # DART 키를 가진 컨테이너는 이것 하나뿐이다. 공개 포트 없음. 접속 대상은 코드에 고정된 opendart.fss.or.kr 하나(2026-10-20 승인).
  disclosure-collector:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kospi-disclosure-collector
    restart: on-failure
    command: ["node", "dist/infrastructure/disclosures/disclosure-collector.js"]
    environment:
      - KAFKA_BROKERS=kafka:29092
      # 키는 프로젝트 루트의 .env에서 변수 치환으로만 받는다 (D-51). DART는 키를 요청 URL에 넣으므로 URL은 로그에 남기지 않는다 (D-59 ⑥).
      - DART_API_KEY=${DART_API_KEY:-}
      # 이미 저장된 기간을 묻는 내부 주소 (SEC-014). Docker 내부 네트워크만 쓰고 키는 보내지 않는다.
      - BACKEND_URL=http://backend:3001
    depends_on:
      kafka:
        condition: service_healthy
      backend:
        condition: service_healthy

  # Frontend UI (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kospi-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

  # --- Monitoring Stack ---

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kospi-kafka-exporter
    command: ["--kafka.server=kafka:29092"]
    restart: on-failure
    ports:
      - "127.0.0.1:9308:9308"
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: kospi-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - kafka-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: kospi-grafana
    # Grafana가 스스로 외부(grafana.com 등)에 접속하지 않게 한다 (docs/Task_ORDER.md T-55, SEC-011). 비밀값이 아닌 설정값이다.
    environment:
      - GF_ANALYTICS_REPORTING_ENABLED=false         # 익명 사용 통계 전송
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false         # Grafana 새 버전 확인
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false  # 플러그인 업데이트 확인
      - GF_PLUGINS_PREINSTALL_DISABLED=true          # 기본 플러그인 자동 설치
      - GF_NEWS_NEWS_FEED_ENABLED=false              # 홈 화면 뉴스 피드
      - GF_SECURITY_DISABLE_GRAVATAR=true            # 프로필 이미지를 gravatar.com에서 받아 오지 않음
    volumes:
      - grafana_data:/var/lib/grafana
      # 데이터소스·대시보드 자동 설정 (docs/Task_ORDER.md T-02). 모두 읽기 전용.
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # 알림 규칙 (T-46). 수신처는 만들지 않고 규칙만 등록한다. 읽기 전용.
      - ./monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  timescaledb_data:
  prometheus_data:
  grafana_data:
