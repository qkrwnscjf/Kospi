global:
  scrape_interval: 5s # Scrape targets every 5 seconds

scrape_configs:
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  # 앱 메트릭 (docs/Task_ORDER.md T-01). 9464는 Docker 내부 네트워크 전용 포트이며 호스트에 공개하지 않는다.
  - job_name: 'worker'
    static_configs:
      - targets: ['worker:9464']

  - job_name: 'backend'
    static_configs:
      - targets: ['backend:9464']

  # DB 적재 컨슈머 (docs/Task_ORDER.md T-12). 내부 전용 포트.
  - job_name: 'db-sink'
    static_configs:
      - targets: ['db-sink:9464']

  # 증시 자금 흐름 수집기 (docs/Task_ORDER.md 11단계 A). 내부 전용 포트.
  - job_name: 'flows-collector'
    static_configs:
      - targets: ['flows-collector:9464']

  # KRX 일별 지수 수집기(T-67)와 DART 공시 수집기(12단계). 내부 전용 포트.
  - job_name: 'krx-collector'
    static_configs:
      - targets: ['krx-collector:9464']

  - job_name: 'disclosure-collector'
    static_configs:
      - targets: ['disclosure-collector:9464']
